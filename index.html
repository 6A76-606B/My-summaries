<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A5E">
<script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#06142C':'#0A2A5E';}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<title>My summaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --text:#0E1B2E; --hero:#0E1B2E; --paper:#F2F4F8; --card:#FFFFFF; --line:#DCE2EB;
  --muted:#667489; --act:#2447C9; --act-ink:#FFFFFF; --ok:#188A5E; --bad:#CC3F36; --gold:#E7AE3B;
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{ --text:#E9EDF4; --hero:#070E1A; --paper:#0A1220; --card:#121E31; --line:#223049; --muted:#94A1B6; --act:#5B7CF0; --ok:#35C48A; --bad:#F06A60; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.6}
body.noscroll{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--act) 55%,transparent);outline-offset:2px}
.ic{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.flip{transform:scaleX(-1)}
.muted{color:var(--muted)} .center{text-align:center} .pad{padding:24px 8px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
small{font-size:.82rem}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:600;border:1.5px solid transparent;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.primary{background:var(--act);color:var(--act-ink)}
.btn.dark{background:var(--hero);color:#fff}
.btn.ghost{border-color:var(--line);background:var(--card)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:var(--card)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:.9rem;border-radius:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);outline:none}
.input:focus{border-color:var(--act)}
textarea.input{resize:vertical;min-height:80px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-weight:600;font-size:.92rem}
.hint{color:var(--muted);font-size:.82rem}
.link{color:var(--act);font-weight:600;padding:4px}
.link.danger{color:var(--bad)}

/* ---------- shell ---------- */
.shell{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--paper)}
.top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px;background:var(--hero);color:#fff;flex:none}
.top .ttl{font-size:1.05rem}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{display:block;font-size:1.02rem;line-height:1.2;letter-spacing:.2px}
.brand small{display:block;color:rgba(255,255,255,.7);line-height:1.3}
.logo{width:38px;height:38px;border-radius:12px;background:var(--gold);color:#2A1B00;display:grid;place-items:center;flex:none}
.avatar-btn{border-radius:50%;padding:0;line-height:0}
.page{flex:1;min-height:0;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.page.chatpage{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.bottom{display:flex;gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--paper);flex:none}
.bn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);font-weight:700;color:var(--muted);transition:background .15s,color .15s}
.bn .ic{width:1.4em;height:1.4em}
.bn.on{background:var(--hero);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(14,27,46,.28)}
.bottom.four .bn{flex-direction:column;gap:2px;height:60px;font-size:.78rem;position:relative}
.dot{position:absolute;top:8px;inset-inline-end:26%;width:9px;height:9px;border-radius:50%;background:var(--bad)}

/* ---------- avatar ---------- */
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--act);color:#fff;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}

/* ---------- auth ---------- */
.auth{min-height:100dvh;background:var(--hero);color:#fff;position:relative;display:flex;flex-direction:column;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,rgba(255,255,255,.055) 35px,rgba(255,255,255,.055) 36px)}
.auth::before{content:'';position:absolute;inset-block:0;inset-inline-start:34px;width:2px;background:rgba(231,174,59,.45)}
.auth .corner{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-end:14px;z-index:2}
.corner button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:.88rem;font-weight:600;border:1px solid rgba(255,255,255,.18)}
.auth-main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:80px 28px 28px 28px;padding-inline-start:60px;max-width:560px;width:100%;margin:0 auto;position:relative}
.wordmark{font-family:Georgia,'Times New Roman',serif;font-size:3rem;line-height:1.05;font-weight:700;letter-spacing:-.5px;direction:ltr;text-align:right}
.wordmark span{display:block}
.wordmark .b{color:var(--gold);font-style:italic}
.tagline{margin-top:16px;color:rgba(255,255,255,.78);font-size:1.05rem;max-width:22rem}
.gbtn{margin-top:36px;display:flex;align-items:center;justify-content:center;gap:12px;min-height:54px;border-radius:16px;background:#fff;color:#1b1b1b;font-weight:700;width:100%}
.auth small{margin-top:14px;color:rgba(255,255,255,.55)}

/* ---------- setup / tracks ---------- */
.plain{min-height:100dvh;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 28px;display:flex;flex-direction:column}
.plain h1{font-size:1.6rem;line-height:1.3;margin-bottom:6px}
.photo-pick{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0}
.photo-pick label{color:var(--act);font-weight:600;cursor:pointer}
.photo-pick input{display:none}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.track{--c:#2447C9;border-radius:22px;padding:20px 16px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;text-align:right;color:#fff;background:var(--c);position:relative;overflow:hidden}
.track::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;border:22px solid rgba(255,255,255,.14);inset-inline-start:-34px;bottom:-34px}
.track .ic{width:2.4rem;height:2.4rem;stroke-width:1.5}
.track b{font-size:1.25rem;display:block}
.track small{opacity:.85}
.track:active{transform:scale(.98)}

/* ---------- lists ---------- */
.seg{display:flex;gap:4px;padding:4px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;margin-bottom:14px;flex:none}
.seg a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:12px;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg a.on{background:var(--act);color:var(--act-ink)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px}
.vcard{display:flex;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:10px;align-items:stretch}
.thumb{width:128px;min-height:78px;border-radius:12px;background:linear-gradient(135deg,var(--hero),#24406b) center/cover;display:grid;place-items:center;color:#fff;flex:none}
.thumb .ic{width:2rem;height:2rem;fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.vinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.vinfo b{line-height:1.4}
.vinfo p{color:var(--muted);font-size:.86rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:color-mix(in srgb,var(--muted) 16%,var(--card));color:var(--muted)}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.badge.gold{background:color-mix(in srgb,var(--gold) 24%,var(--card));color:#8A5E00}
@media (prefers-color-scheme:dark){.badge.gold{color:var(--gold)}}
.badge.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card));color:var(--bad)}
.fcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;width:100%;text-align:right}
.fico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--act) 14%,var(--card));color:var(--act);flex:none;overflow:hidden}
.fico img{width:100%;height:100%;object-fit:cover}
.fico .ic{width:1.6rem;height:1.6rem}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;color:var(--muted);text-align:center}
.empty .ic{width:2.4rem;height:2.4rem;opacity:.6}
.skel{height:92px;border-radius:var(--r);background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- video / exam ---------- */
.player{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden}
.player iframe,.player video{width:100%;height:100%;display:block;border:0}
.vmeta{margin:14px 0}
.vmeta h1{font-size:1.2rem;line-height:1.4}
.vmeta p{color:var(--muted);margin-top:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--act);border-radius:99px;transition:width .4s}
.bar.done i{background:var(--ok)}
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 12px}
.lock-ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 22%,var(--card));color:#8A5E00}
@media (prefers-color-scheme:dark){.lock-ic{color:var(--gold)}}
.lock-ic .ic{width:2.4rem;height:2.4rem}
.examhead{display:flex;align-items:center;gap:12px;font-weight:600}
.examhead .bar{flex:1}
.qtext{font-size:1.25rem;line-height:1.6;margin:10px 0 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:right;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);transition:border-color .15s,background .15s}
.opt .l{width:32px;height:32px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:700;flex:none}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--card))}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt[disabled]{pointer-events:none}
.fb{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.expl{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--gold) 16%,var(--card));border:1.5px solid color-mix(in srgb,var(--gold) 45%,var(--line))}
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:10px auto;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:1.9rem;font-weight:700}
.rv{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.rv .ic{margin-top:4px}

/* ---------- chat ---------- */
:root{--nl:38%}
@media (prefers-color-scheme:dark){:root{--nl:74%}}
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.chead{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:2px 0 8px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);flex:none}
.chead .chi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 4px 12px color-mix(in srgb,var(--c) 35%,transparent)}
.chead b{display:block;line-height:1.3}.chead small{color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:12px 10px;border-radius:18px;border:1.5px solid var(--line);overscroll-behavior:contain;
  background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--act) 8%,transparent),transparent 55%),color-mix(in srgb,var(--paper) 55%,var(--card))}
.msg{display:flex;gap:8px;margin:8px 0;align-items:flex-end}
.msg.new{animation:msgin .28s ease-out}
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg.new{animation:none}.recdot{animation:none!important}}
.msg.mine{flex-direction:row-reverse}
.mav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,hsl(var(--h,220) 62% 52%),hsl(var(--h,220) 62% 36%));color:#fff;display:grid;place-items:center;font-size:.82rem;font-weight:700;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.bub{position:relative;max-width:78%;min-width:70px;padding:8px 12px 5px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 3px rgba(14,27,46,.07);border-end-start-radius:5px}
.msg.mine .bub{background:linear-gradient(135deg,var(--act),color-mix(in srgb,var(--act) 60%,#0EA5E9));color:#fff;border-color:transparent;border-end-start-radius:18px;border-end-end-radius:5px;box-shadow:0 4px 14px color-mix(in srgb,var(--act) 30%,transparent)}
.mn{font-size:.76rem;font-weight:700;color:hsl(var(--h,220) 55% var(--nl))}
.msg.mine .mn{color:rgba(255,255,255,.85)}
.mn em{font-style:normal;background:var(--gold);color:#2A1B00;padding:0 7px;border-radius:99px;font-size:.7rem;margin-inline-start:4px}
.bub p{white-space:pre-wrap;word-break:break-word}
.bub time{display:block;font-size:.68rem;opacity:.65;text-align:end;margin-top:1px}
.bub.hasimg{width:min(78%,290px)}
.mimg{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin:4px 0;cursor:zoom-in;background:color-mix(in srgb,var(--line) 60%,transparent)}
.mdel{position:absolute;top:2px;inset-inline-end:-30px;color:var(--bad);padding:4px}
.aplayer{display:flex;align-items:center;gap:10px;min-width:220px;padding:4px 0}
.aplay{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--act);color:#fff}
.aplay .ic{grid-area:1/1;fill:currentColor}
.aplay .ic:nth-child(2){display:none}
.aplayer.playing .aplay .ic:nth-child(1){display:none}
.aplayer.playing .aplay .ic:nth-child(2){display:inline-block}
.msg.mine .aplay{background:#fff;color:var(--act)}
.wv{flex:1;display:flex;align-items:center;gap:2px;height:32px;cursor:pointer}
.wv i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.3;transition:opacity .15s,background .15s}
.wv i.on{opacity:1;background:var(--act)}
.msg.mine .wv i.on{background:#fff}
.adur{font-size:.74rem;font-variant-numeric:tabular-nums;opacity:.8;min-width:34px;text-align:end}
.chat-empty{display:grid;place-items:center;gap:8px;text-align:center;color:var(--muted);padding:40px 12px}
.chat-empty span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--act) 12%,var(--card));color:var(--act)}
.chat-empty .ic{width:1.6em;height:1.6em}
.composer,.recbar{display:flex;gap:6px;align-items:center;padding:6px;margin:8px 0 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 6px 20px rgba(14,27,46,.09);flex:none}
.composer:focus-within{border-color:var(--act)}
.composer[hidden],.recbar[hidden]{display:none}
.composer input:not([type=file]){flex:1;min-width:0;min-height:42px;padding:0 10px;border:0;background:none;outline:none}
.composer input:disabled{opacity:.6}
.send{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--act),color-mix(in srgb,var(--act) 60%,#0EA5E9));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--act) 35%,transparent)}
.send[disabled]{opacity:.5}
.composer.chatc.has .mic,.composer.chatc:not(.has) .send:not(.mic){display:none}
.cbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none;cursor:pointer}
.cbtn:hover{background:color-mix(in srgb,var(--act) 10%,transparent);color:var(--act)}
.cbtn[disabled],.cbtn.dis{opacity:.45;pointer-events:none}
.recbar{border-color:var(--bad)}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:recp 1s ease-in-out infinite;margin-inline-start:6px}
@keyframes recp{50%{opacity:.25;transform:scale(.7)}}
.recbar b{font-variant-numeric:tabular-nums;min-width:40px}
.recwave{flex:1;display:flex;align-items:center;gap:3px;height:28px;overflow:hidden}
.recwave i{flex:1;max-width:5px;border-radius:3px;background:var(--bad);opacity:.7;animation:recw 1s ease-in-out infinite}
@keyframes recw{0%,100%{height:20%}50%{height:90%}}
.cprev{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-top:8px;border-radius:16px;background:var(--card);border:1.5px solid var(--line)}
.cprev img{width:54px;height:54px;object-fit:cover;border-radius:10px}
.cprev span{flex:1;color:var(--muted);font-size:.88rem}
.lb{position:fixed;inset:0;z-index:120;background:rgba(5,10,20,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out;animation:msgin .2s}
.lb img{max-width:100%;max-height:88vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lbx{position:absolute;top:max(14px,env(safe-area-inset-top));inset-inline-end:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.mmore{position:absolute;top:3px;inset-inline-end:4px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;opacity:.55;fill:currentColor}
.mmore:hover{opacity:1;background:rgba(127,127,127,.18)}
.mmore .ic{fill:currentColor;stroke:none}
.bub.hasmore .mn{padding-inline-end:24px}
.bub.pollb{width:min(88%,340px)}
.msg.flash .bub{animation:flash 1.5s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 1px 3px rgba(14,27,46,.07)}}
.pinbar{display:flex;align-items:center;gap:4px;margin:0 0 8px;padding:4px 6px 4px 4px;border-radius:14px;background:color-mix(in srgb,var(--gold) 16%,var(--card));border:1.5px solid color-mix(in srgb,var(--gold) 55%,var(--line))}
.pinmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:start;padding:4px 8px}
.pinmain .ic{color:#B7791F;flex:none}
.pinmain span{min-width:0;display:block}
.pinmain b{display:block;font-size:.8rem}
.pinmain b em{font-style:normal;color:var(--muted);font-weight:500}
.pinmain small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.poll{display:flex;flex-direction:column;gap:8px;min-width:230px}
.pq{font-weight:700;line-height:1.5;word-break:break-word}
.pq .ic{margin-inline-end:4px}
.pops{display:flex;flex-direction:column;gap:6px}
.popt{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:6px 12px;border-radius:12px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--paper) 70%,var(--card));color:var(--text);text-align:start}
.popt .pfill{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:color-mix(in srgb,var(--act) 22%,transparent);transition:width .5s ease}
.popt .plab,.popt .ppct{position:relative}
.popt .ppct{font-variant-numeric:tabular-nums;font-size:.84rem;opacity:.85}
.popt.mine{border-color:var(--act);font-weight:700}
.popt.mine .pfill{background:color-mix(in srgb,var(--act) 34%,transparent)}
.popt[disabled]{cursor:default}
.pmeta{display:flex;justify-content:space-between;font-size:.74rem;opacity:.75}
.pclosed{color:var(--bad);font-weight:700}
.msg.mine .popt{color:var(--text)}
.msg.mine .pq{color:#fff}
.mtn{font-weight:700;color:var(--act);background:color-mix(in srgb,var(--act) 12%,transparent);border-radius:6px;padding:0 3px}
.mtn.me,.mtn.all{color:var(--text);background:color-mix(in srgb,var(--gold) 38%,transparent)}
.msg.mine .mtn{color:#fff;background:rgba(255,255,255,.24)}
.bub.ment{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 38%,transparent)}
.mpop{max-height:236px;overflow-y:auto;margin-top:6px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 10px 28px rgba(14,27,46,.18)}
.mrow{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;text-align:start;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow.on,.mrow:hover{background:color-mix(in srgb,var(--act) 10%,transparent)}
.mrow b{display:block;line-height:1.3}.mrow small{display:block;color:var(--muted);font-size:.76rem}
.mrow .mav{width:36px;height:36px}
.mav.all{background:linear-gradient(135deg,var(--gold),#C98A14);color:#2A1B00}
.cnote{padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--gold) 20%,var(--card));font-size:.88rem;text-align:center;margin-bottom:6px}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex:none;flex-wrap:wrap}

/* ---------- admin ---------- */
.stats{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.stat{flex:none;min-width:84px;padding:10px 12px;border-radius:14px;background:var(--card);border:1.5px solid var(--line)}
.stat b{display:block;font-size:1.3rem;line-height:1.2}
.stat small{color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);margin-bottom:12px}
.search input{flex:1;border:0;background:none;outline:none;min-height:44px}
.urow{display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:12px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line)}
.urow .info{flex:1;min-width:0}
.urow .info b,.urow .info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--c,var(--act));color:#fff}
.irow{display:flex;gap:10px;align-items:center;padding:12px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line)}
.irow .info{flex:1;min-width:0}
.irow .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qb{padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.opt-edit{display:flex;gap:8px;align-items:center}
.opt-edit input[type=radio]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.qtype{font-weight:600}
.qb textarea.model{min-height:96px}

/* ---------- leaderboard ---------- */
.brow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line)}
.brow.me{border-color:var(--act);background:color-mix(in srgb,var(--act) 9%,var(--card))}
.brow .info{flex:1;min-width:0}
.brow .info b,.brow .info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--paper);color:var(--muted);flex:none}
.rk.r1{background:#E7AE3B;color:#2A1B00}
.rk.r2{background:#C3CAD6;color:#1d2735}
.rk.r3{background:#D08A57;color:#2b1405}
.pts{text-align:end;flex:none}
.pts b{display:block;font-size:1.15rem;line-height:1.2}
.pts small{color:var(--muted)}
.mycard{display:flex;justify-content:space-around;text-align:center;background:var(--hero);color:#fff;border-color:transparent}
.mycard small{display:block;color:rgba(255,255,255,.7)}
.mycard b{font-size:1.5rem;line-height:1.3}

/* ---------- essay / ai inline ---------- */
.gres{padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px}
.gres.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,var(--card))}
.gres.half{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card))}
.gres.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.gres p{white-space:pre-wrap;word-break:break-word}
.pbar{position:relative;height:22px;border-radius:999px;background:color-mix(in srgb,var(--line) 70%,var(--card));overflow:hidden}
.pbar i{position:absolute;inset-block:0;inset-inline-start:0;display:block;background:var(--ok);border-radius:999px;transition:width .6s ease}
.gres.half .pbar i{background:var(--gold)}
.gres.bad .pbar i{background:var(--bad)}
.pbar span{position:relative;display:block;text-align:center;font-size:.8rem;font-weight:700;line-height:22px}
.model-box{padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line);background:var(--card)}
.model-box p{white-space:pre-wrap;word-break:break-word;margin-top:4px}
.ai-inline{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:10px}
.ai-inline .aibody{max-height:340px;min-height:56px}
.ai-inline .composer{padding:8px 0 0}

/* ---------- sheet / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(7,14,26,.55);z-index:50}
.sheet{position:fixed;inset-inline:0;bottom:0;margin-inline:auto;max-width:760px;max-height:90dvh;overflow-y:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);z-index:51;animation:up .22s ease-out}
.sheet.tall{height:90dvh;display:flex;flex-direction:column;overflow:hidden}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-weight:700;font-size:1.1rem}
.x{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.aibody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.ai-m{padding:10px 14px;border-radius:16px;max-width:92%;background:var(--card);border:1.5px solid var(--line);white-space:normal;word-break:break-word}
.ai-m.u{align-self:flex-start;background:var(--act);color:#fff;border-color:transparent}
.ai-m.err{color:var(--bad)}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
#toast{position:fixed;inset-inline:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);margin-inline:auto;max-width:420px;padding:12px 16px;border-radius:14px;background:var(--hero);color:#fff;text-align:center;z-index:99;opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s}
#toast.show{opacity:1;transform:none}
#toast.bad{background:var(--bad)}
.lightbox img{width:100%;border-radius:12px}
.fatal{max-width:520px;margin:20vh auto;padding:24px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chat v2: أحسن من واتساب ---------- */
.chat{position:relative}
.msgs{padding:14px 10px 10px;scroll-behavior:smooth;
  background:
   radial-gradient(circle at 12% 0%,color-mix(in srgb,var(--act) 10%,transparent),transparent 50%),
   radial-gradient(circle at 92% 100%,color-mix(in srgb,#0EA5E9 8%,transparent),transparent 48%),
   color-mix(in srgb,var(--paper) 55%,var(--card))}
.msgs::-webkit-scrollbar{width:6px}.msgs::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 35%,transparent);border-radius:9px}
.msg{margin:10px 0 2px;align-items:flex-start}
.msg.cont{margin-top:2px}
.msg.cont .mav{visibility:hidden}
.msg.cont .mn{display:none}
.msg.cont .bub{border-start-start-radius:18px}
.msg.mine.cont .bub{border-start-end-radius:18px}
.bub{padding:8px 13px 6px;line-height:1.65;font-size:.98rem;transition:transform .12s}
.bub:active{transform:scale(.995)}
.bub time{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:.66rem;margin-top:0}
.mav{width:34px;height:34px;box-shadow:0 0 0 2px var(--card),0 3px 8px rgba(0,0,0,.18)}
.chead{background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--act)) 12%,var(--card)),var(--card));box-shadow:0 4px 14px rgba(14,27,46,.06)}
.composer{padding:5px 6px;gap:4px;border-radius:26px;box-shadow:0 8px 26px rgba(14,27,46,.12);transition:border-color .15s,box-shadow .15s}
.composer:focus-within{box-shadow:0 8px 26px color-mix(in srgb,var(--act) 22%,transparent)}
.composer input:not([type=file]){font-size:1rem;min-height:44px}
.composer input::placeholder{color:var(--muted);opacity:.85}
.send{transition:transform .12s,box-shadow .12s}
.send:active{transform:scale(.88)}
.send.mic{background:var(--card);color:var(--act);border:1.5px solid var(--line);box-shadow:none}
.tobot{position:absolute;inset-inline-start:14px;bottom:86px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--act);border:1.5px solid var(--line);box-shadow:0 6px 18px rgba(14,27,46,.22);z-index:5;animation:msgin .2s}
.chat-empty span{width:72px;height:72px;box-shadow:0 8px 24px color-mix(in srgb,var(--act) 18%,transparent)}

/* AI chat */
.aibody{gap:8px;padding:6px 2px 10px;scroll-behavior:smooth}
.ai-m{position:relative;padding:10px 14px 11px;border-radius:18px;border-start-start-radius:5px;max-width:90%;line-height:1.75;box-shadow:0 1px 3px rgba(14,27,46,.07);animation:msgin .25s ease-out}
.ai-m:not(.u):not(.err)::before{content:"✦ " var(--ainame,"مدرّس الـ AI");display:block;font-size:.72rem;font-weight:700;color:var(--act);margin-bottom:2px}
.ai-m.u{background:linear-gradient(135deg,var(--act),color-mix(in srgb,var(--act) 60%,#0EA5E9));border-start-start-radius:18px;border-start-end-radius:5px;box-shadow:0 4px 14px color-mix(in srgb,var(--act) 28%,transparent)}
.ai-m.err{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.typing{gap:5px;padding:4px 2px}.typing i{width:8px;height:8px;background:var(--act);animation:bounce 1.1s infinite ease-in-out}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.ai-inline{border-radius:18px;background:color-mix(in srgb,var(--paper) 60%,var(--card))}

/* خانة كتابة الإجابة */
textarea.wbox{min-height:150px;padding:14px 16px;border-radius:20px;font-size:1.02rem;line-height:1.8;resize:none;box-shadow:0 6px 20px rgba(14,27,46,.07);transition:border-color .15s,box-shadow .15s;overflow-y:auto}
textarea.wbox:focus{box-shadow:0 8px 26px color-mix(in srgb,var(--act) 20%,transparent)}
.wcount{display:block;text-align:end;color:var(--muted);margin-top:-6px;font-variant-numeric:tabular-nums}
.cnote{border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line));line-height:1.7}

/* ---------- محرر الأسئلة (اختياري / مقالي) ---------- */
.qb{position:relative;padding:14px;border-radius:18px;gap:10px;box-shadow:0 4px 14px rgba(14,27,46,.05)}
.qb.mcq{border-inline-start:4px solid var(--act)}
.qb.essay{border-inline-start:4px solid var(--gold)}
.qhead{display:flex;align-items:center;gap:10px}
.qnum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--hero);color:#fff;font-weight:700;font-size:.9rem;flex:none}
.qseg{flex:1;display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1.5px solid var(--line)}
.qseg button{flex:1;min-height:38px;border-radius:10px;font-weight:700;color:var(--muted);transition:background .15s,color .15s}
.qseg button.on{background:var(--act);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--act) 35%,transparent)}
.qb.essay .qseg button.on{background:var(--gold);color:#2A1B00;box-shadow:0 3px 10px color-mix(in srgb,var(--gold) 40%,transparent)}
.qdel,.odel{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--bad);flex:none}
.qdel:hover,.odel:hover{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.odel[disabled]{opacity:.25;pointer-events:none}
.opt-edit{gap:6px}
.olet{width:26px;text-align:center;font-weight:700;color:var(--muted);flex:none}
.opt-edit .input{min-height:44px}
.oadd{align-self:flex-start;border-style:dashed}
.qhead{flex-wrap:wrap}.qseg{flex:1 1 160px}
.qtools{display:flex;gap:2px}
.qtools button{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:.8rem}
.qtools button:hover:not([disabled]){background:color-mix(in srgb,var(--act) 12%,transparent);color:var(--act)}
.qtools button[disabled]{opacity:.25;pointer-events:none}
.opt-edit{padding:3px 6px;border-radius:14px;border:1.5px solid transparent;transition:background .15s,border-color .15s}
.opt-edit.ok{background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.opt-edit.ok .olet{color:var(--ok)}
.bub,.ai-m{overflow-wrap:anywhere}
.qadv{border:1.5px dashed var(--line);border-radius:14px;padding:8px 12px}
.qadv summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:.9rem}
.qadv[open] summary{margin-bottom:8px}.qadv[open]{display:flex;flex-direction:column;gap:8px}
.qb.essay textarea.model{min-height:120px;font-size:1.02rem;line-height:1.8}
/* ---- لمسة أخيرة على المنصة ---- */
html,body{background:radial-gradient(900px 420px at 100% -8%,color-mix(in srgb,var(--act) 10%,transparent),transparent 70%),var(--paper)}
.sheet form>button[type=submit].btn.primary{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) - 6px);z-index:2;margin-top:6px;box-shadow:0 -10px 18px var(--paper),0 6px 16px color-mix(in srgb,var(--act) 30%,transparent)}
.irow .icon-btn{width:40px;height:40px;border-radius:12px;transition:transform .12s,background .15s}
.irow .icon-btn:active{transform:scale(.92)}
.btn{transition:transform .12s,box-shadow .15s,opacity .12s,background .15s}
.btn.ghost:hover{border-color:var(--act);color:var(--act)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.card,.irow{transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:color-mix(in srgb,var(--act) 28%,var(--line))}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page>*{animation:rise .32s ease-out both}
.page>*:nth-child(2){animation-delay:.04s}.page>*:nth-child(3){animation-delay:.08s}.page>*:nth-child(4){animation-delay:.12s}.page>*:nth-child(n+5){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){.page>*{animation:none}html{scroll-behavior:auto}}

/* ---------- تنظيم عام ---------- */
.page{padding:16px 16px 28px;scroll-behavior:smooth}
.page::-webkit-scrollbar{width:6px}.page::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 30%,transparent);border-radius:9px}
.card,.vcard,.fcard,.irow,.urow,.rv,.brow{border-radius:18px;box-shadow:0 2px 10px rgba(14,27,46,.045);transition:transform .12s,box-shadow .15s,border-color .15s}
a.vcard:active,.fcard:active,.urow:active{transform:scale(.99)}
a.vcard:hover,.fcard:hover,.urow:hover{box-shadow:0 8px 22px rgba(14,27,46,.1);border-color:color-mix(in srgb,var(--act) 35%,var(--line))}
.stack{gap:14px}
h2{line-height:1.4}h3{margin:6px 0}
.btn{min-height:50px;border-radius:16px;letter-spacing:.1px}
.btn.primary{background:linear-gradient(135deg,var(--act),color-mix(in srgb,var(--act) 62%,#0EA5E9));box-shadow:0 6px 16px color-mix(in srgb,var(--act) 28%,transparent)}
.btn.primary:disabled,.btn.primary[disabled]{box-shadow:none}
.input,select.input,textarea.input{border-radius:16px;transition:border-color .15s,box-shadow .15s}
.input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--act) 16%,transparent)}
.seg{border-radius:18px;box-shadow:0 2px 10px rgba(14,27,46,.045)}
.seg a{height:44px;border-radius:14px;transition:background .15s,color .15s}
.seg a.on{box-shadow:0 4px 12px color-mix(in srgb,var(--act) 32%,transparent)}
.bottom{box-shadow:0 -6px 20px rgba(14,27,46,.06);border-top:1px solid var(--line)}
.bn{border-radius:20px}
.top{box-shadow:0 4px 18px rgba(0,0,0,.22);position:relative;z-index:3}
.badge,.chip{letter-spacing:.1px}
.stat{border-radius:16px;box-shadow:0 2px 10px rgba(14,27,46,.045)}
.sheet{border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.sheet.tall::before{flex:none}

/* ---------- الامتحان للطالب ---------- */
.examhead{padding:10px 14px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 2px 10px rgba(14,27,46,.045)}
.examhead .bar{height:10px;margin:0}
.examhead .bar i{background:linear-gradient(90deg,var(--act),#0EA5E9)}
.qtext{font-size:1.3rem;line-height:1.7;margin:16px 2px 18px;font-weight:700}
.opts{gap:12px}
.opt{padding:14px 16px;border-radius:18px;box-shadow:0 2px 8px rgba(14,27,46,.04);line-height:1.6}
.opt:not([disabled]):hover{border-color:var(--act);background:color-mix(in srgb,var(--act) 6%,var(--card))}
.opt:not([disabled]):active{transform:scale(.985)}
.opt .l{width:36px;height:36px;font-size:.95rem;background:color-mix(in srgb,var(--act) 12%,var(--card));color:var(--act)}
.fb{gap:12px}
.expl{border-radius:16px;line-height:1.75}

/* فاصل اليوم في الشات */
.msg.dayfirst{flex-wrap:wrap;margin-top:16px}
.msg.dayfirst::before{content:attr(data-day);flex:0 0 100%;width:max-content;max-width:100%;margin:0 auto 10px;padding:3px 14px;border-radius:99px;background:color-mix(in srgb,var(--card) 80%,var(--line));border:1px solid var(--line);color:var(--muted);font-size:.74rem;font-weight:600;text-align:center;box-shadow:0 1px 4px rgba(14,27,46,.06)}

/* =====================================================================
   REDESIGN v2 — "Midnight Aurora"
   بنفسجي ليلي + شفق متحرك + خطوط Lalezar / Readex Pro
   ===================================================================== */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
@property --spot{syntax:'<number>';inherits:true;initial-value:0}

:root{
  --text:#0B1B33; --hero:#0A2A5E; --paper:#EEF4FB; --card:rgba(255,255,255,.84); --line:rgba(20,80,160,.16);
  --muted:#5B6F8C; --act:#1769E0; --act-ink:#fff; --ok:#10A37A; --bad:#E5484D; --gold:#FFB534;
  --hot:#12B5E5; --aqua:#1FD2C2; --r:24px; --sh:10,40,100;
  --grad:linear-gradient(120deg,#1769E0 0%,#0EA5E9 52%,#12B5E5 100%);
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --disp:'Lalezar','Readex Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --text:#EAF2FF; --hero:#06142C; --paper:#071120; --card:rgba(18,34,66,.68); --line:rgba(110,170,255,.18);
    --muted:#93A8C8; --act:#4D9BFF; --ok:#2FD8A0; --bad:#FF6B73; --sh:0,0,0;
  }
}

/* ---------- base ---------- */
html{background:var(--paper)}
body{background:transparent;font-family:'Readex Pro','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.75;font-weight:400}
h1,h2{font-family:var(--disp);font-weight:400;letter-spacing:0}
h2{font-size:1.5rem}
::selection{background:color-mix(in srgb,var(--hot) 38%,transparent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--hot) 65%,transparent);outline-offset:3px}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-thumb{background:linear-gradient(var(--act),var(--hot));border-radius:9px}

/* شفق متحرك في الخلفية */
body::before,body::after{content:'';position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(64px)}
body::before{width:70vmax;height:70vmax;top:-26vmax;inset-inline-end:-22vmax;opacity:.5;background:radial-gradient(circle,var(--act),transparent 66%);
  animation:xdrift1 24s ease-in-out infinite alternate;translate:calc(var(--px,0)*-34px) calc(var(--py,0)*-34px);transition:translate .5s ease-out}
body::after{width:62vmax;height:62vmax;bottom:-26vmax;inset-inline-start:-22vmax;opacity:.38;background:radial-gradient(circle,var(--hot),transparent 66%);
  animation:xdrift2 30s ease-in-out infinite alternate;translate:calc(var(--px,0)*28px) calc(var(--py,0)*28px);transition:translate .5s ease-out}
@media (prefers-color-scheme:light){body::before{opacity:.32}body::after{opacity:.22}}
@keyframes xdrift1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-10vmax,8vmax) scale(1.15)}100%{transform:translate(6vmax,16vmax) scale(.95)}}
@keyframes xdrift2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12vmax,-8vmax) scale(1.2)}100%{transform:translate(-4vmax,-14vmax) scale(1)}}

/* ---------- كل الحركات ---------- */
@keyframes xrise{from{opacity:0;transform:translateY(26px) scale(.97)}}
@keyframes xpop{from{opacity:0;transform:scale(.6) rotate(-4deg)}}
@keyframes xbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes xspin{to{transform:rotate(360deg)}}
@keyframes xbreathe{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.18);opacity:.62}}
@keyframes xgrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes xping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@keyframes xsheen{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes xdrop{from{transform:translateY(-100%);opacity:0}}
@keyframes xdock{from{transform:translateY(140%);opacity:0}}
@keyframes xsheet{from{transform:translateY(70%) scale(.96);opacity:0}}
@keyframes xscrim{from{opacity:0}}
@keyframes xtoast{0%{opacity:0;transform:translateY(30px) scale(.85)}100%{opacity:1;transform:none}}
@keyframes xshake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes xright{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes xstripes{to{background-position:22px 0}}
@keyframes xring{from{--p:0}}
@keyframes xwiggle{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-10deg)}92%{transform:rotate(9deg)}95%{transform:rotate(-6deg)}98%{transform:rotate(3deg)}}
@keyframes xhalo{0%{box-shadow:0 0 0 0 rgba(255,181,52,.65)}100%{box-shadow:0 0 0 14px rgba(255,181,52,0)}}
@keyframes xglow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes xletter{from{opacity:0;transform:translateY(70%) rotate(9deg) scale(.5);filter:blur(10px)}}
@keyframes xfloat{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate3d(var(--dx,30px),-118vh,0) rotate(var(--rot,180deg));opacity:0}}
@keyframes xhue{0%{filter:hue-rotate(-35deg)}100%{filter:hue-rotate(45deg)}}
@keyframes xmsg{from{opacity:0;transform:translateY(14px) scale(.88)}}
@keyframes xsend{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--act) 55%,transparent)}60%{box-shadow:0 0 0 12px transparent}}
@keyframes xrip{to{transform:scale(1);opacity:0}}
@keyframes xtwinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes xslidex{from{opacity:0;transform:translateX(34px)}}

/* ---------- دخول الصفحات ---------- */
.page>*{animation:xrise .7s var(--ease) backwards}
.page>*:nth-child(2){animation-delay:.07s}.page>*:nth-child(3){animation-delay:.14s}.page>*:nth-child(4){animation-delay:.21s}.page>*:nth-child(n+5){animation-delay:.28s}
.stack>*,.opts>*,.toolbar>*{animation:xrise .65s var(--ease) backwards}
.stack>*:nth-child(1){animation-delay:.05s}.stack>*:nth-child(2){animation-delay:.11s}.stack>*:nth-child(3){animation-delay:.17s}
.stack>*:nth-child(4){animation-delay:.23s}.stack>*:nth-child(5){animation-delay:.29s}.stack>*:nth-child(6){animation-delay:.35s}
.stack>*:nth-child(7){animation-delay:.4s}.stack>*:nth-child(8){animation-delay:.45s}.stack>*:nth-child(n+9){animation-delay:.5s}
.opts>*:nth-child(1){animation-delay:.12s}.opts>*:nth-child(2){animation-delay:.2s}.opts>*:nth-child(3){animation-delay:.28s}.opts>*:nth-child(4){animation-delay:.36s}.opts>*:nth-child(n+5){animation-delay:.44s}
.qtext{animation:xrise .7s var(--ease) backwards}

/* ---------- الهيكل ---------- */
.shell{background:transparent}
.top{position:relative;z-index:3;overflow:hidden;gap:12px;padding-bottom:18px;color:#fff;
  background:linear-gradient(120deg,#0A2A5E 0%,#1769E0 55%,#0F4C9E 100%);
  border-radius:0 0 32px 32px;box-shadow:0 16px 36px -16px rgba(70,24,190,.75);animation:xdrop .8s var(--ease) backwards}
.top::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.17) 50%,transparent 62%);animation:xsheen 8s ease-in-out 1.6s infinite}
.top .ttl,.brand b{font-family:var(--disp);font-weight:400;font-size:1.3rem;letter-spacing:.2px}
.brand small{color:rgba(255,255,255,.75)}
.logo{background:linear-gradient(135deg,#FFD36B,#12B5E5);color:#06223A;border-radius:14px;box-shadow:0 6px 18px rgba(255,79,154,.55);animation:xwiggle 6s ease-in-out 2s infinite}
.icon-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:14px;transition:transform .25s var(--spring),background .2s}
.icon-btn:hover{background:rgba(255,255,255,.26);transform:translateX(3px)}
.icon-btn:active{transform:scale(.88)}
.avatar-btn .av{box-shadow:0 0 0 2px rgba(255,255,255,.55),0 6px 16px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.avatar-btn:hover .av{transform:rotate(-8deg) scale(1.1)}
.page{padding:20px 16px 34px}

/* الدوك السفلي */
.bottom{margin:0 12px 10px;padding:7px 7px calc(env(safe-area-inset-bottom,0px) + 7px);border:1px solid var(--line);border-radius:30px;
  background:color-mix(in srgb,var(--paper) 70%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:0 18px 40px -14px rgba(var(--sh),.5);animation:xdock .9s var(--spring) .15s backwards;gap:6px}
.bottom .bn,.bottom.four .bn{position:relative;overflow:hidden;border:0;background:transparent;border-radius:23px;height:60px;color:var(--muted);transition:color .25s,transform .3s var(--spring)}
.bottom .bn:hover{color:var(--act)}
.bottom .bn:active{transform:scale(.9)}
.bottom .bn.on,.bottom.four .bn.on{color:#fff;background:var(--grad);background-size:220% 220%;animation:xgrad 6s ease infinite;box-shadow:0 10px 24px -6px color-mix(in srgb,var(--act) 70%,transparent)}
.bottom .bn.on .ic{animation:xpop .6s var(--spring) both}
.bottom .bn span{font-weight:600}
.dot{background:var(--hot)}
.dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--hot);animation:xping 1.6s ease-out infinite}

/* ---------- عناصر عامة ---------- */
.btn{position:relative;overflow:hidden;min-height:52px;border-radius:999px;font-weight:600;transition:transform .3s var(--spring),box-shadow .25s,background .2s,border-color .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--grad);background-size:220% 220%;animation:xgrad 7s ease infinite;box-shadow:0 12px 26px -8px color-mix(in srgb,var(--act) 75%,transparent)}
.btn.primary::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-130%);animation:xsheen 5s ease-in-out 1s infinite}
.btn.dark{background:linear-gradient(135deg,#0A2A5E,#1769E0)}
.btn.ghost{background:var(--card);border-color:var(--line)}
.btn.sm{min-height:42px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:xrip .7s ease-out forwards;pointer-events:none;z-index:0}
.ghost .rip,.opt .rip,.card .rip,.vcard .rip,.fcard .rip,.urow .rip,.bn:not(.on) .rip{background:color-mix(in srgb,var(--act) 28%,transparent)}
.input,select.input,textarea.input{border-radius:20px;border-width:1.5px;transition:border-color .25s,box-shadow .3s,transform .3s var(--spring)}
.input:focus{border-color:var(--act);box-shadow:0 0 0 5px color-mix(in srgb,var(--act) 18%,transparent);transform:translateY(-1px)}
.field>label{font-weight:600}
.link{color:var(--act)}
.badge{padding:3px 12px;font-weight:600;border:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.seg{border-radius:999px;padding:5px;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 26px -14px rgba(var(--sh),.4)}
.seg a{position:relative;overflow:hidden;height:44px;border-radius:999px;transition:color .25s,transform .3s var(--spring)}
.seg a:active{transform:scale(.93)}
.seg a.on{background:var(--grad);background-size:220% 220%;animation:xgrad 6s ease infinite;color:#fff;box-shadow:0 8px 18px -6px color-mix(in srgb,var(--act) 65%,transparent)}
.seg a.on .ic{animation:xpop .5s var(--spring) both}

/* الكروت مع إضاءة بتتبع الإصبع/الماوس */
.card,.vcard,.fcard,.irow,.urow,.rv,.brow,.stat{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--act) calc(var(--spot)*24%),transparent),transparent 72%),var(--card);
  box-shadow:0 14px 34px -18px rgba(var(--sh),.5);
  transition:--spot .35s ease,transform .4s var(--spring),box-shadow .3s,border-color .3s}
.card:hover,.vcard:hover,.fcard:hover,.irow:hover,.urow:hover,.rv:hover,.brow:hover,.stat:hover{--spot:1}
a.vcard:hover,.fcard:hover,.urow:hover{transform:translateY(-4px);box-shadow:0 22px 40px -18px rgba(var(--sh),.6);border-color:color-mix(in srgb,var(--act) 45%,var(--line))}
a.vcard:active,.fcard:active,.urow:active{transform:scale(.97)}
.vcard{padding:10px;gap:14px}
.thumb{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#0A2A5E,#1769E0 70%,#12B5E5) center/cover;box-shadow:0 10px 22px -10px rgba(var(--sh),.8)}
.thumb::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(15,5,40,.55))}
.thumb::after{content:'';position:absolute;width:48px;height:48px;inset:0;margin:auto;border-radius:50%;border:2px solid rgba(255,255,255,.9);animation:xping 2.2s ease-out infinite}
.thumb .ic{position:relative;z-index:1;box-sizing:content-box;width:1.15rem;height:1.15rem;padding:12px;border-radius:50%;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .35s var(--spring)}
a.vcard:hover .thumb .ic{transform:scale(1.18)}
.vinfo b{font-weight:600}
.fico{border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--act) 20%,var(--card)),color-mix(in srgb,var(--hot) 16%,var(--card)));color:var(--act)}
.fico .ic{animation:xbob 3.4s ease-in-out infinite}
.empty{padding:60px 16px}
.empty .ic{width:3.2rem;height:3.2rem;opacity:.85;color:var(--act);animation:xbob 3.2s ease-in-out infinite}
.skel{border-radius:var(--r);height:98px;background:linear-gradient(100deg,var(--line) 20%,color-mix(in srgb,var(--act) 18%,var(--card)) 50%,var(--line) 80%);background-size:220% 100%;animation:sk 1.3s infinite linear}

/* ---------- الدخول (البطل) ---------- */
.auth{background:radial-gradient(120% 70% at 85% 0%,#0F4C9E 0%,transparent 60%),radial-gradient(90% 60% at 0% 100%,#0A7C9C 0%,transparent 60%),#06142C;overflow:hidden;color:#fff}
.auth::before{content:'';position:absolute;inset:auto;top:-30vmin;inset-inline-end:-42vmin;width:125vmin;height:125vmin;border-radius:50%;
  background:conic-gradient(from 0deg,#1769E0,#12B5E5,#FFB534,#1FD2C2,#1769E0);filter:blur(70px);opacity:.5;animation:xspin 26s linear infinite}
.auth::after{content:'';position:absolute;bottom:-34vmin;inset-inline-start:-34vmin;width:90vmin;height:90vmin;border-radius:50%;background:radial-gradient(circle,#1FD2C2,transparent 66%);filter:blur(46px);animation:xbreathe 9s ease-in-out infinite}
.auth .fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl{position:absolute;bottom:-70px;font-style:normal;font-family:var(--disp);color:rgba(255,255,255,.16);animation:xfloat linear infinite;will-change:transform;line-height:1}
.orbits{position:absolute;top:27%;inset-inline-end:-6vmin;width:0;height:0}
.orbit{position:absolute;left:0;top:0;border-radius:50%;border:1px dashed rgba(255,255,255,.2);animation:xspin linear infinite}
.orbit i{position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--c,#FFB534);box-shadow:0 0 18px var(--c,#FFB534),0 0 40px var(--c,#FFB534)}
.orbit.o1{width:46vmin;height:46vmin;margin:-23vmin 0 0 -23vmin;animation-duration:14s;--c:#FFB534}
.orbit.o2{width:74vmin;height:74vmin;margin:-37vmin 0 0 -37vmin;animation-duration:24s;animation-direction:reverse;--c:#12B5E5}
.orbit.o3{width:104vmin;height:104vmin;margin:-52vmin 0 0 -52vmin;animation-duration:38s;--c:#1FD2C2}
.auth .corner{z-index:3}
.corner button{background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22);transition:transform .3s var(--spring),background .2s;animation:xslidex .8s var(--ease) 1.2s backwards}
.corner button:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}
.auth-main{z-index:1;padding:96px 28px 44px;padding-inline-start:28px;max-width:560px}
.wordmark{font-family:var(--disp);font-weight:400;font-size:clamp(3.2rem,16vw,6rem);line-height:.98;letter-spacing:0;white-space:nowrap;text-shadow:0 10px 50px rgba(106,76,255,.6)}
.wordmark .ch{display:inline-block;font-style:normal;animation:xletter 1s var(--spring) backwards;animation-delay:calc(var(--i)*70ms + .25s)}
.wordmark .b{font-style:normal;color:inherit;animation:xhue 6s ease-in-out infinite alternate}
.wordmark .b .ch{background:linear-gradient(90deg,#FFB534,#12B5E5 40%,#0EA5E9 75%,#1FD2C2);background-size:420% 100%;background-position:calc(var(--i)*11%) 0;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.tagline{font-size:1.08rem;line-height:1.9;color:rgba(255,255,255,.82);animation:xrise .9s var(--ease) 1.1s backwards}
.gbtn{position:relative;overflow:hidden;border-radius:999px;min-height:58px;box-shadow:0 18px 40px -10px rgba(255,255,255,.28),0 0 0 6px rgba(255,255,255,.1);transition:transform .35s var(--spring),box-shadow .3s;
  animation:xrise .9s var(--ease) 1.35s backwards,xbob 4s ease-in-out 2.4s infinite}
.gbtn::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(106,76,255,.28) 50%,transparent 60%);transform:translateX(-130%);animation:xsheen 4.5s ease-in-out 2s infinite}
.gbtn:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 24px 50px -10px rgba(255,255,255,.4),0 0 0 8px rgba(255,255,255,.14)}
.gbtn:active{transform:scale(.95)}
.auth small{color:rgba(255,255,255,.6);animation:xrise .9s var(--ease) 1.6s backwards}

/* ---------- الإعداد والتخصصات ---------- */
.plain h1{font-size:2.2rem;line-height:1.25;animation:xrise .8s var(--ease) backwards}
.photo-pick .av{box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--act),0 0 40px color-mix(in srgb,var(--act) 55%,transparent);animation:xpop .8s var(--spring) backwards}
.photo-pick label{padding:8px 18px;border-radius:999px;border:1.5px dashed color-mix(in srgb,var(--act) 55%,var(--line));transition:background .2s,transform .3s var(--spring)}
.photo-pick label:hover{background:color-mix(in srgb,var(--act) 10%,transparent);transform:scale(1.05)}
.tracks{perspective:900px}
.track{position:relative;overflow:hidden;border:0;border-radius:32px;min-height:196px;padding:22px 18px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 88%,#fff),color-mix(in srgb,var(--c) 62%,#0A1B45));
  box-shadow:0 22px 40px -16px color-mix(in srgb,var(--c) 85%,transparent);
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s var(--ease),box-shadow .3s;animation:xpop .8s var(--spring) backwards}
.track:nth-child(1){animation-delay:.1s}.track:nth-child(2){animation-delay:.2s}.track:nth-child(3){animation-delay:.3s}.track:nth-child(4){animation-delay:.4s}
.track::after{width:150px;height:150px;border:26px solid rgba(255,255,255,.14);animation:xspin 18s linear infinite;inset-inline-start:-44px;bottom:-44px}
.track::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(200px circle at var(--mx,30%) var(--my,10%),rgba(255,255,255,.3),transparent 70%)}
.track .ic{position:relative;z-index:1;width:2.8rem;height:2.8rem;animation:xbob 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.track:nth-child(2) .ic{animation-delay:-.9s}.track:nth-child(3) .ic{animation-delay:-1.8s}.track:nth-child(4) .ic{animation-delay:-2.7s}
.track span{position:relative;z-index:1}
.track b{font-family:var(--disp);font-weight:400;font-size:1.6rem;line-height:1.2}
.track:hover{box-shadow:0 30px 50px -14px color-mix(in srgb,var(--c) 95%,transparent)}
.track:active{transform:perspective(800px) scale(.94)}

/* ---------- الفيديو والامتحان ---------- */
.player{border-radius:28px;box-shadow:0 26px 50px -18px rgba(var(--sh),.8),0 0 0 1px var(--line)}
.vmeta h1{font-size:1.6rem;line-height:1.35}
.bar{height:10px;background:color-mix(in srgb,var(--line) 90%,transparent)}
.bar i{background:var(--grad);background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25% 50%,rgba(255,255,255,.28) 50% 75%,transparent 75%),var(--grad);background-size:22px 22px,100% 100%;animation:xstripes 1s linear infinite;transition:width .9s var(--ease)}
.bar.done i{background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25% 50%,rgba(255,255,255,.28) 50% 75%,transparent 75%),linear-gradient(90deg,var(--ok),var(--aqua))}
.examhead{border-radius:999px;padding:12px 18px;background:var(--card);border:1px solid var(--line)}
.examhead .bar i{background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25% 50%,rgba(255,255,255,.28) 50% 75%,transparent 75%),var(--grad)}
.qtext{font-weight:600;font-size:1.32rem}
.opt{position:relative;overflow:hidden;border-radius:22px;border:1.5px solid var(--line);background:var(--card);transition:transform .35s var(--spring),border-color .2s,background .2s,box-shadow .3s}
.opt:not([disabled]):hover{transform:translateX(-6px);border-color:var(--act);box-shadow:0 14px 28px -14px color-mix(in srgb,var(--act) 70%,transparent)}
.opt:not([disabled]):active{transform:scale(.96)}
.opt .l{background:linear-gradient(135deg,color-mix(in srgb,var(--act) 20%,var(--card)),color-mix(in srgb,var(--hot) 14%,var(--card)));color:var(--act);transition:transform .35s var(--spring)}
.opt:not([disabled]):hover .l{transform:rotate(-12deg) scale(1.12)}
.opt.right{animation:xright .6s var(--spring);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent),0 14px 30px -12px color-mix(in srgb,var(--ok) 60%,transparent)}
.opt.right .l{background:var(--ok);color:#fff;animation:xpop .5s var(--spring)}
.opt.wrong{animation:xshake .5s ease}

@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}

/* ---------- وضع فاتح / داكن ---------- */
:root{--solid:#fff;--wa:#25D366}
@media (prefers-color-scheme:dark){:root{--solid:#0F2040}}
html[data-theme=light]{color-scheme:light;--text:#0B1B33;--hero:#0A2A5E;--paper:#EEF4FB;--card:rgba(255,255,255,.86);--solid:#fff;--line:rgba(20,80,160,.16);--muted:#5B6F8C;--act:#1769E0;--ok:#10A37A;--bad:#E5484D;--sh:10,40,100;--nl:38%}

html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{transition:background-color .55s,color .55s,border-color .55s,box-shadow .55s!important}
html::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.8;animation:xstar 5s ease-in-out infinite;
  background:radial-gradient(2px 2px at 12% 22%,var(--act),transparent),radial-gradient(1.6px 1.6px at 78% 14%,var(--hot),transparent),radial-gradient(2.2px 2.2px at 62% 62%,var(--aqua),transparent),radial-gradient(1.5px 1.5px at 28% 78%,var(--gold),transparent),radial-gradient(1.8px 1.8px at 90% 84%,var(--act),transparent),radial-gradient(1.4px 1.4px at 44% 8%,var(--hot),transparent),radial-gradient(1.6px 1.6px at 8% 56%,var(--aqua),transparent)}
.themebtn{position:relative;overflow:hidden;flex:none}
.themebtn .ic{position:absolute;inset:0;margin:auto;width:1.3em;height:1.3em;transition:transform .6s var(--spring),opacity .35s}
.themebtn .tsun{color:#FFD36B}.themebtn .tmoon{color:#CFE3FF}
html[data-theme=dark] .themebtn .tsun,html[data-theme=light] .themebtn .tmoon{opacity:0;transform:rotate(-110deg) scale(.2)}
.themebtn:hover .ic{filter:drop-shadow(0 0 7px currentColor)}
.corner{display:flex;gap:8px;align-items:center}

/* ---------- تابعنا (واتساب) ---------- */
.follow{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:28px;color:#fff;

.msgs,.shell.full .msgs{padding:16px 12px 12px;border-radius:30px 30px 10px 10px;border:1px solid var(--line);box-shadow:inset 0 2px 24px -10px rgba(var(--sh),.35);
  background:radial-gradient(color-mix(in srgb,var(--act) 15%,transparent) 1.3px,transparent 1.6px) 0 0/22px 22px,
   linear-gradient(135deg,transparent 0 46%,color-mix(in srgb,var(--act) 6%,transparent) 46% 54%,transparent 54%) 0 0/44px 44px,
   radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--act) 17%,transparent),transparent 46%),

   color-mix(in srgb,var(--solid) 58%,transparent)}
.msg{gap:9px;margin:12px 0 2px}.msg.cont{margin-top:3px}
.msg.mine.new{animation:xsin .5s var(--spring)}.msg:not(.mine).new{animation:xrin .5s var(--spring)}

.bub{max-width:80%;padding:9px 14px 6px;font-size:1.02rem;line-height:1.7;border-radius:24px;border-start-start-radius:8px;background:color-mix(in srgb,var(--solid) 92%,transparent);box-shadow:0 10px 22px -14px rgba(var(--sh),.55)}

<script type="module">

import {increment,getFirestore,doc,getDoc,getDocs,setDoc as _setDoc,addDoc as _addDoc,updateDoc as _updateDoc,deleteDoc as _deleteDoc,collection,query,where,orderBy,limit,onSnapshot,serverTimestamp,writeBatch as _writeBatch}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* وضع معاينة الأدمن كطالب: القراءة شغالة والكتابة متوقفة عشان ما يتلخبطش بيانات حقيقية */

const _nb={set(){return _nb},update(){return _nb},delete(){return _nb},commit:async()=>{}};
const setDoc=(...a)=>viewAs?Promise.resolve():_setDoc(...a);

const updateDoc=(...a)=>viewAs?Promise.resolve():_updateDoc(...a);

const writeBatch=d=>viewAs?_nb:_writeBatch(d);

/* =====================================================================
   CONFIG — paste your values from Firebase Console > Project settings
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyClrmNqejej-eE_tifXK_q5TFOdk6Tpo1Q",
  authDomain: "learn-english-e8df8.firebaseapp.com",
  projectId: "learn-english-e8df8",
  storageBucket: "learn-english-e8df8.firebasestorage.app",
  messagingSenderId: "393207198417",
  appId: "1:393207198417:web:21280f89da9e5b2b3b8bf0",
  measurementId: "G-E1YK0F2K2C"
};
// Cloudflare Worker URL (file 3). Leave empty until the worker is deployed.
const WORKER_URL = "https://cold-night-2989.markogorge18.workers.dev/";
// إيميل الأدمن (لازم يتعمل له حساب في Firebase Authentication بإيميل وباسورد)
const ADMIN_EMAIL = "ahmedgalal@gmail.com";

/* ===================================================================== */
const app = document.getElementById('app');
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (n, c='') => `<svg class="ic ${c}"><use href="#${n}"/></svg>`;

if (firebaseConfig.apiKey.startsWith('PUT_')) {
  app.innerHTML = `<div class="fatal"><h2>الإعداد ناقص</h2><p class="muted">افتح index.html وحط apiKey و appId و messagingSenderId من إعدادات مشروع Firebase في كائن firebaseConfig.</p></div>`;
  throw new Error('Firebase config missing');
}

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

/* ---------- constants ---------- */
const TRACKS = {
  med:  {name:'الطب',     color:'#17917F', icon:'i-med',  sub:'علوم وأحياء'},
  eng:  {name:'الهندسة',  color:'#2F63D6', icon:'i-eng',  sub:'رياضة وفيزياء'},
  art:  {name:'الأدب',    color:'#C9702A', icon:'i-art',  sub:'لغات وعلوم إنسانية'},
  mgmt: {name:'الإدارة',  color:'#2E8B57', icon:'i-mgmt', sub:'اقتصاد ومحاسبة'}

/* ---------- state ---------- */
let ready=false, me=null, admin=false, profile=null, profUnsub=null, gateKey='';

let prog={watched:{},attempts:{}}, progLoaded=false, boardSynced=false;
let adminUsers=[], bq=[];

/* ---------- helpers ---------- */
let tt;
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',3400);}
function fail(e){console.error(e);toast(e&&e.code==='permission-denied'?'مفيش صلاحية — راجع قواعد Firestore':((e&&e.message)||'حصل خطأ'),true);}
const byDate=(a,b)=>(b.createdAt?.seconds??9e9)-(a.createdAt?.seconds??9e9);
const fmtTime=ts=>{try{return ts?.toDate?ts.toDate().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';}catch{return '';}};
const initial=n=>esc((n||'؟').trim().charAt(0));
const parts=()=>location.hash.replace(/^#\/?/,'').split('/');
function avatar(p,size=36){
  const s=`width:${size}px;height:${size}px;font-size:${size*.42}px`;
  return p&&p.photoURL?`<span class="av" style="${s}"><img src="${esc(p.photoURL)}" alt="" referrerpolicy="no-referrer"></span>`:`<span class="av" style="${s}">${initial(p&&p.name)}</span>`;
}
function ytId(u){try{const x=new URL(u);if(x.hostname.includes('youtu.be'))return x.pathname.slice(1).split('/')[0]||null;
  if(x.hostname.includes('youtube.com')){if(x.searchParams.get('v'))return x.searchParams.get('v');const m=x.pathname.match(/\/(embed|shorts|live)\/([^/?]+)/);if(m)return m[2];}}catch{}return null;}
const isDirect=u=>/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(u);
const fileKind=u=>/\.pdf(\?|#|$)/i.test(u)?'pdf':/\.(png|jpe?g|gif|webp|avif|svg)(\?|#|$)/i.test(u)?'image':'link';
const empty=(msg,ic='i-content')=>`<div class="empty">${icon(ic)}<div>${esc(msg)}</div></div>`;
const seg=(items,cur,base)=>`<div class="seg">${items.map(([k,l,ic])=>`<a href="${base}${k}" class="${k===cur?'on':''}">${icon(ic)}<span>${l}</span></a>`).join('')}</div>`;
const trackOpts=(sel,withAll)=>(withAll?`<option value="all" ${sel==='all'?'selected':''}>كل التخصصات</option>`:'')+Object.entries(TRACKS).map(([k,t])=>`<option value="${k}" ${sel===k?'selected':''}>${t.name}</option>`).join('');
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const fmtN=n=>{n=+n||0;return String(Math.round(n*100)/100);};
const qType=q=>(q&&q.type)||'mcq';
/* أنواع الأسئلة اللي الـ AI بيصحّحها وبيدّي نسبة قرب الإجابة (0–100%) */
const AIT={
  essay:{label:'مقالي',rows:6,ph:'اكتب إجابتك هنا…',kind:'سؤال مقالي (ممكن يكون شرح أو أكمل أو ترجمة أو مسألة أو أي نوع تاني)'},
  short:{label:'إجابة قصيرة',rows:2,ph:'اكتب إجابتك…',kind:'سؤال إجابة قصيرة'},
  fill:{label:'أكمل الفراغ',rows:2,ph:'اكتب الكلمة أو الجملة الناقصة…',kind:'سؤال أكمل الفراغ'},
  translate:{label:'ترجمة',rows:4,ph:'اكتب الترجمة…',kind:'سؤال ترجمة'},
  problem:{label:'مسألة / حل خطوات',rows:6,ph:'اكتب الحل وخطواته…',kind:'مسألة (الإجابة النهائية والخطوات)'},
  custom:{label:'سؤال حر (أي نوع)',rows:5,ph:'اكتب إجابتك…',kind:'سؤال حر'}
};
const isAI=t=>Object.prototype.hasOwnProperty.call(AIT,t);
function ranked(arr,key){let r=0,prev=null;return arr.map((x,i)=>{if(x[key]!==prev){r=i+1;prev=x[key];}return {...x,rank:r};});}
function fileToDataURL(file,size=160){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),s=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.75));};
  img.onerror=()=>rej(new Error('الصورة مش مقروءة'));img.src=url;});}

async function loadProgress(force){
  if(progLoaded&&!force)return prog;
  const [w,a]=await Promise.all([getDocs(collection(db,'progress',me.uid,'watched')),getDocs(collection(db,'progress',me.uid,'attempts'))]);
  prog={watched:{},attempts:{}};w.forEach(d=>prog.watched[d.id]=d.data());a.forEach(d=>prog.attempts[d.id]=d.data());progLoaded=true;return prog;
}

/* ---------- delegated events ---------- */
const acts={}, forms={}, chg={};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&acts[el.dataset.act])acts[el.dataset.act](el,e);});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();if(forms[f.dataset.form])forms[f.dataset.form](f,e);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&chg[el.dataset.chg])chg[el.dataset.chg](el,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
function qbInput(e){const t=e.target,f=t.dataset&&t.dataset.qf;if(!f)return;const q=bq[+t.dataset.i];if(!q)return;
  if(f==='type'){if(e.type==='change')setQType(q,t.value);return;}
  if(f==='opt')q.options[+t.dataset.j]=t.value;else if(f==='correct'){q.correct=+t.value;const b=t.closest('.qb');if(b)b.querySelectorAll('.opt-edit').forEach(r=>r.classList.toggle('ok',r.contains(t)));}else q[f]=t.value;}
document.addEventListener('input',qbInput);document.addEventListener('change',qbInput);

/* ---------- sheet ---------- */
function openSheet(html,cls=''){$('#modal-root').innerHTML=`<div class="scrim" data-act="close-sheet"></div><section class="sheet ${cls}" role="dialog" aria-modal="true">${html}</section>`;document.body.classList.add('noscroll');}
function closeSheet(){const r=$('#modal-root');if(r)r.innerHTML='';document.body.classList.remove('noscroll');if(aiState&&aiState.body!=='ibody'&&aiState.body!=='abody')aiState=null;}
acts['close-sheet']=closeSheet;
const sheetHead=t=>`<div class="sheet-h"><span>${t}</span><button class="x" data-act="close-sheet" aria-label="إغلاق">${icon('i-x')}</button></div>`;

/* =====================================================================
   AUTH
   ===================================================================== */
const authMsg=e=>({'auth/invalid-credential':'الإيميل أو الباسورد غلط','auth/wrong-password':'الإيميل أو الباسورد غلط','auth/user-not-found':'الإيميل أو الباسورد غلط',
  'auth/too-many-requests':'محاولات كتير، استنى شوية وجرّب تاني','auth/unauthorized-domain':'الدومين ده مش مضاف في Authorized domains في Firebase','auth/network-request-failed':'مفيش اتصال بالإنترنت'}[e.code]||e.code||'حصل خطأ');

async function googleLogin(){
  const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,p);}
  catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))return signInWithRedirect(auth,p);
    if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code))toast(authMsg(e),true);
  }
}
acts['google']=googleLogin;
acts['admin-login']=()=>openSheet(`${sheetHead('دخول الأدمن')}
  <form data-form="admin-login">
    <div class="field"><label>الإيميل</label><input class="input" name="email" type="email" autocomplete="username" required dir="ltr"></div>
    <div class="field"><label>الباسورد</label><input class="input" name="pass" type="password" autocomplete="current-password" required dir="ltr"></div>
    <button class="btn primary block" type="submit">دخول</button>
  </form>`);
forms['admin-login']=async f=>{
  const b=f.querySelector('button');b.disabled=true;
  try{await signInWithEmailAndPassword(auth,f.elements.email.value.trim(),f.elements.pass.value);closeSheet();}
  catch(e){toast(authMsg(e),true);b.disabled=false;}
};
acts['logout']=async()=>{closeSheet();location.hash='';await signOut(auth);};

onAuthStateChanged(auth,async u=>{
  if(profUnsub){profUnsub();profUnsub=null;}
  profile=null;gateKey='';progLoaded=false;boardSynced=false;me=u;admin=false;
  if(!u){if(aiNameUnsub){aiNameUnsub();aiNameUnsub=null;}ready=true;render();return;}
  if(!aiNameUnsub){
    try{const sn=await getDoc(doc(db,'settings','ai'));applyAIName(sn.exists()?sn.data().name:'');}catch{}
    aiNameUnsub=onSnapshot(doc(db,'settings','ai'),sn=>applyAIName(sn.exists()?sn.data().name:''),()=>{});
  }
  admin=(u.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase();
  if(!admin){try{admin=(await getDoc(doc(db,'admins',u.uid))).exists();}catch{admin=false;}}
  if(!admin&&u.providerData.some(p=>p.providerId==='password')){await signOut(auth);toast('الحساب ده مش أدمن',true);return;}
  if(admin){ready=true;render();return;}
  profUnsub=onSnapshot(doc(db,'users',u.uid),s=>{
    profile=s.exists()?{uid:u.uid,...s.data()}:null;
    const k=[!!profile,profile&&profile.banned,profile&&profile.kicked,profile&&profile.muted,profile&&profile.track,profile&&profile.name,profile&&(profile.photoURL||'').length].join('|');
    if(k===gateKey)return;gateKey=k;ready=true;render();
  },e=>{ready=true;fail(e);render();});
});
window.addEventListener('hashchange',()=>{if(ready)render();});

/* =====================================================================
   ROUTER
   ===================================================================== */
function render(){
  unsubs.forEach(f=>{try{f();}catch{}});unsubs=[];
  cleanups.forEach(f=>{try{f();}catch{}});cleanups=[];
  chatCleanup();chatCtx=null;aiState=null;aiRO=false;closeSheet();routeTok++;{const o=document.getElementById('pvbar');if(o)o.remove();}
  if(!ready){app.innerHTML='';return;}
  if(!me)return viewAuth();
  if(admin&&viewAs){
    profile={uid:me.uid,name:'طالب (معاينة)',track:viewAs.track,photoURL:''};studentRoute();
    const b=document.createElement('button');b.id='pvbar';b.dataset.act='view-exit';b.textContent='👁 معاينة طالب '+((TRACKS[viewAs.track]||{}).name||'')+' — اضغط للرجوع للأدمن';document.body.appendChild(b);return;
  }
  if(admin)return adminRoute();
  if(!profile)return viewSetup();
  if(profile.banned)return viewBanned();
  if(!profile.track)return viewTracks();
  studentRoute();
}
function studentRoute(){
  const [a,b]=parts();
  if(a==='video'&&b)return viewVideo(b);
  if(a==='exam'&&b)return viewExam(b);
  if(a==='ai')return viewAIChat();
  if(a==='community')return viewCommunity(b);
  if(a==='board')return viewBoard(b,parts()[2]);
  return viewContent(a==='content'?b:'videos');
}

function runExam(ex,tok){
  const Q=ex.questions;let i=0,score=0;const answers=[],grades=[],notes=[],skips=[];const page=$('#page');
  const ctxOf=k=>{const q=Q[k],t=qType(q);
    return isAI(t)
      ?{exam:ex.title,type:'essay',question:q.q,modelAnswer:q.model||'',rubric:q.rubric||'',studentAnswer:answers[k]??'',grade:grades[k]??null,percent:grades[k]==null?null:Math.round(grades[k]*100),feedback:notes[k]||'',explain:q.explain||''}
      :{exam:ex.title,type:t,question:q.q,options:q.options,correct:q.correct,chosen:answers[k]??null,explain:q.explain||''};};
  const head=()=>`<div class="examhead"><span>${i+1} / ${Q.length}</span><div class="bar"><i style="width:${(i/Q.length)*100}%"></i></div></div><h2 class="qtext">${esc(Q[i].q)}</h2>`;
  const ask=()=>{
    aiState=null;
    const q=Q[i];
    if(isAI(qType(q))){
      const T=AIT[qType(q)];
      page.innerHTML=head()+`<form id="ef" class="stack"><textarea class="input wbox" id="eans" rows="${T.rows}" maxlength="2000" placeholder="${T.ph}"></textarea><button class="btn primary block" type="submit">${icon('i-spark')} إرسال للتصحيح</button></form><div class="fb" id="fb"></div>`;
      $('#ef').onsubmit=ev=>{ev.preventDefault();submitEssay();};
    }else{
      page.innerHTML=head()+`<div class="opts">${q.options.map((o,j)=>`<button class="opt" data-j="${j}"><span class="l">${LETTERS[j]||j+1}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="fb" id="fb"></div>`;
      $$('.opt',page).forEach(b=>b.onclick=()=>pick(+b.dataset.j));
    }
  };
  /* الشرح المبدئي + زر الشرح بالـ AI تحته (بيفتح محادثة داخل الصفحة وينفع تستفسر فيها) */
  const feedback=extra=>{
    const q=Q[i],k=i,last=i===Q.length-1;
    $('#fb').innerHTML=`${extra||''}${q.explain?`<div class="expl"><b>الشرح:</b> ${esc(q.explain)}</div>`:''}
      <button class="btn ghost block" id="aib">${icon('i-spark')} اشرحلي أكتر بالـ AI</button>
      <div id="inai"></div>
      <button class="btn primary block" id="nxt">${last?'شوف النتيجة':'السؤال اللي بعده'}</button>`;
    $('#aib').onclick=e=>{e.currentTarget.style.display='none';startInline(k);};
    $('#nxt').onclick=()=>{if(last)finish();else{i++;ask();}};
    $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  const startInline=k=>{
    const host=$('#inai');if(!host)return;
